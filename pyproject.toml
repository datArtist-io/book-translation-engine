[project]
name = "book-translation-engine"
version = "0.1.0"
description = "Accuracy-first, format-preserving book translation engine for printing presses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "lxml>=5.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "langcodes>=3.4",
  "language_data>=1.2",
  "pycountry>=23.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "python-docx>=1.1"]

[project.scripts]
bte = "bte.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bte*"]

[tool.setuptools.package-data]
bte = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
